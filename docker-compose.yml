services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cortex-postgres
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: cortex
      # Secrets come from the environment or a .env file — no plaintext defaults
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --save 60 1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  ollama:
    image: ollama/ollama
    container_name: cortex-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    # Serve first, then pull models in the background so the container
    # becomes healthy quickly and the api service can start.
    command: >
      sh -c "ollama serve &
             until ollama list > /dev/null 2>&1; do sleep 2; done &&
             ollama pull llama3.2:1b &&
             ollama pull nomic-embed-text &&
             wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  api:
    build: .
    container_name: cortex-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cortex:${POSTGRES_PASSWORD}@postgres:5432/cortex}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      OLLAMA_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    build: .
    container_name: cortex-worker
    command: python worker.py
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cortex:${POSTGRES_PASSWORD}@postgres:5432/cortex}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      OLLAMA_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
  ollama_models:
